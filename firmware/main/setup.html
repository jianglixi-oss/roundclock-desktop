<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圆屏时钟设置</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#101114;color:#f3f3f5;font:16px system-ui,-apple-system,sans-serif;max-width:460px;margin:32px auto;padding:24px}h1{font-size:30px;margin-bottom:8px}p{line-height:1.6;color:#adb0ba}.card{padding:20px;background:#1c1d23;border-radius:22px;margin:22px 0}label{display:block;margin-top:16px;color:#dedee4}input,select,button{width:100%;padding:14px;border-radius:12px;border:1px solid #3e404b;background:#282a32;color:inherit;font:inherit;margin-top:8px}button{cursor:pointer;font-weight:600;border:0;background:#ffb351;color:#201507}button.secondary{background:#30323d;color:#eee}button:disabled{opacity:.5;cursor:wait}input[type=checkbox]{width:auto;margin:0 8px 0 0}small{display:block;font-size:13px;color:#9295a0;line-height:1.6}#message{min-height:26px;color:#ffbe70}#manual-name[hidden]{display:none}.check{font-size:14px;color:#aaa}#scan-status{margin:12px 0 0;font-size:14px}
</style>
<h1>圆屏时钟</h1>
<p>选择家中的 2.4 GHz Wi-Fi，连接后自动校时。</p>
<section class="card">
  <button id="scan" class="secondary" type="button">扫描附近 Wi-Fi</button>
  <p id="scan-status" role="status" aria-live="polite">正在准备扫描…</p>
  <form id="wifi-form">
    <label for="networks">选择网络</label>
    <select id="networks"><option value="">请先扫描附近网络</option></select>
    <label class="check"><input type="checkbox" id="manual">手动输入隐藏网络</label>
    <input id="manual-name" aria-label="隐藏网络名称" placeholder="Wi-Fi 名称" maxlength="32" autocomplete="off" hidden>
    <label for="password">Wi-Fi 密码</label>
    <input id="password" type="password" maxlength="63" autocomplete="new-password" placeholder="输入所选网络的密码">
    <button type="submit" id="save">保存并连接</button>
  </form>
</section>
<button id="sync" class="secondary" type="button">使用手机 / 电脑时间校时</button>
<p id="message" role="status" aria-live="polite"></p>
<small>设备热点无需密码。请保持连接设备热点后操作。<br>时区：北京时间 · Hermes Agent 待接入</small>
<script>
const $=id=>document.getElementById(id);
async function request(url,data){
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const response=await fetch(url,data===undefined?{cache:'no-store',signal:controller.signal}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});
    const result=await response.json();
    if(!response.ok||result.error)throw Error(result.error||'请求失败，请重试');
    return result;
  }finally{clearTimeout(timer)}
}
function updatePassword(){
  const option=$('networks').selectedOptions[0];
  const open=!$('manual').checked&&option&&option.dataset.secure==='false';
  $('password').disabled=open;
  $('password').placeholder=open?'此网络无需密码':'输入所选网络的密码';
  if(open)$('password').value='';
}
async function scan(){
  $('scan').disabled=true;$('scan-status').textContent='正在扫描附近的 2.4 GHz 网络…';
  const previous=$('networks').value;
  try{
    const result=await request('/api/scan');
    $('networks').replaceChildren(new Option('请选择 Wi-Fi',''));
    for(const network of result.networks){
      const option=new Option(network.ssid+' · '+network.rssi+' dBm'+(network.secure?' 🔒':''),network.ssid);
      option.dataset.secure=String(network.secure);$('networks').add(option);
    }
    if([...$('networks').options].some(option=>option.value===previous))$('networks').value=previous;
    $('scan-status').textContent=result.networks.length?'找到 '+result.networks.length+' 个网络，请选择。':'未发现网络，可重新扫描或手动输入隐藏网络。';
    updatePassword();
  }catch(error){$('scan-status').textContent=error.name==='AbortError'?'扫描超时，请重新扫描。':error.message}
  finally{$('scan').disabled=false}
}
$('scan').onclick=scan;$('networks').onchange=updatePassword;
$('manual').onchange=()=>{
  $('manual-name').hidden=!$('manual').checked;$('networks').disabled=$('manual').checked;updatePassword();
};
$('wifi-form').onsubmit=async event=>{
  event.preventDefault();const ssid=$('manual').checked?$('manual-name').value:$('networks').value;
  if(!ssid){$('message').textContent='请先选择一个 Wi-Fi 网络';return}
  $('save').disabled=true;
  try{await request('/api/config',{ssid,password:$('password').disabled?'':$('password').value});$('message').textContent='已保存，设备正在重启并连接网络。'}
  catch(error){$('message').textContent=error.name==='AbortError'?'请求超时，请检查设备连接。':error.message;$('save').disabled=false}
};
$('sync').onclick=async()=>{
  try{await request('/api/time',{epoch:Math.floor(Date.now()/1000)});$('message').textContent='时间已同步'}
  catch(error){$('message').textContent=error.message}
};
scan();
</script>
</html>
