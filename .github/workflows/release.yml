name: Publish release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "RoundClock Desktop $tag" --notes-file CHANGELOG.md --latest
